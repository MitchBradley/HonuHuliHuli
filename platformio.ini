; HonuHuliHuli - turntable indexer, ESP-IDF version for the classic ESP32
; (D1 mini ESP32 / MH-ET LIVE MiniKit layout).
;
; Same platform as FluidNC: pioarduino's espressif32, ESP-IDF 5.5.x.

[env:esp32]
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.39
framework = espidf
board = esp32dev
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
